<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120d05" />
  <meta name="description" content="Flores amarillas para mi Coco, hechas con cariño y código." />
  <title>Para ti, mi Coco</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="celebration" aria-hidden="true"></canvas>

  <main class="phone" aria-label="Detalle para Coco">
    <section class="screen screen--hero" id="inicio" aria-labelledby="heroTitle">
      <div class="panel hero-card">
        <p class="kicker">Hecho con amor ❤️</p>
        <h1 id="heroTitle">Para ti,<br>mi Coco</h1>
        <p class="hero-text">
          Como en la florería no había un ramo del tamaño de una casa 😆,
          te regalo estas flores que son mucho más especiales, únicas y hechas solo para ti.
        </p>

        <div class="actions" aria-label="Opciones del detalle">
          <button class="btn btn--primary" id="flowersButton" type="button">Toca aquí</button>
          <button class="btn btn--soft" id="messageButton" type="button">Leer mi mensaje</button>
        </div>
      </div>
    </section>

    <section class="screen screen--flowers" id="flores" aria-labelledby="flowersTitle">
      <h2 class="sr-only" id="flowersTitle">Flores amarillas para Coco</h2>
      <div class="flowers-card" id="flowersCard" role="img" aria-label="Un ramo de flores amarillas virtuales">
        <div class="flower-glow" aria-hidden="true"></div>
        <svg class="bouquet-svg" id="bouquetSvg" viewBox="0 0 430 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      </div>
    </section>

    <section class="screen screen--message" id="mensaje" aria-labelledby="messageTitle">
      <div class="panel message-card">
        <svg class="heart" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="heartFill" x1="12" y1="8" x2="52" y2="58" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fff6b8" />
              <stop offset="0.48" stop-color="#ffd84d" />
              <stop offset="1" stop-color="#ffae21" />
            </linearGradient>
          </defs>
          <path d="M32 56.2s-2.8-2.1-6.5-5.1C14.6 42.2 7 35.2 7 24.2 7 16.4 12.8 10.8 20 10.8c4.8 0 9.2 2.7 12 7.1 2.8-4.4 7.2-7.1 12-7.1 7.2 0 13 5.6 13 13.4 0 11-7.6 18-18.5 26.9-3.7 3-6.5 5.1-6.5 5.1Z" fill="url(#heartFill)"/>
        </svg>

        <h2 id="messageTitle">Para mi Coco</h2>

        <div class="message-box" aria-live="polite">
          <p id="rotatingText"></p>
          <div class="formula" id="formulaBlock" role="math" aria-label="f de x igual a uno sobre x">
            <span>f(x)</span>
            <span>=</span>
            <span class="fraction"><span>1</span><span>x</span></span>
          </div>
          <div class="phrase-dots" id="phraseDots" aria-label="Frases del mensaje"></div>
        </div>

        <p class="commit-line">De mí para ti: un <code>commit</code> eterno de amor.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
